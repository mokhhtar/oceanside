name: Amazon Price Updater

#on:
#  schedule:
#    - cron: '0 8 * * *'
  workflow_dispatch:

# إضافة صلاحية إنشاء طلبات المراجعة للبوت
permissions:
  contents: write
  pull-requests: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-amazon-paapi

      - name: Run Price Updater Script
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
        run: python update_prices.py

      # 🟢 التعديل الجذري هنا: إنشاء Pull Request بدل الرفع المباشر
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto-update Amazon prices & timestamp"
          title: "📦 التحديث الآلي لأسعار أمازون"
          body: |
            قام البوت بتشغيل سكريبت `update_prices.py` ووجد أسعاراً جديدة.
            يرجى مراجعة التغييرات (Files changed) للتأكد من صحتها قبل ضغط **Merge**.
          branch: "auto-price-update"
          delete-branch: true
          labels: "automated, price-update"