name: Update Amazon Prices (Direct API)

on:
  schedule:
    - cron: '0 0 * * *' # يعمل تلقائياً كل يوم في منتصف الليل
  workflow_dispatch: # يسمح لك بتشغيله يدوياً للتجربة

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Verify file exists
        run: |
          if [ -f "blog/best-electric-shavers-sensitive-skin-2025/index.html" ]; then
            echo "✅ File found"
            ls -lh blog/best-electric-shavers-sensitive-skin-2025/index.html
          else
            echo "❌ File not found!"
            exit 1
          fi
          
      - name: Run Update Script
        run: python update_prices.py
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "Showing first 50 lines of diff:"
            git diff blog/best-electric-shavers-sensitive-skin-2025/index.html | head -50
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add blog/best-electric-shavers-sensitive-skin-2025/index.html
          git commit -m "🤖 Auto-update Amazon prices [$(date +'%Y-%m-%d %H:%M')]"
          git push
          
      - name: No changes notification
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "ℹ️  No price changes - skipping commit"
